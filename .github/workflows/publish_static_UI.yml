name: publish_build
run-name: Building and Publishing static GUI
on: 
  push:
    branches:
      - feature/GUIWorkflow
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/static
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check directory
        run: pwd
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: npm ci
        with:
          working-directory: web/static
      - name: Build GUI
        run: npm run build
        with:
          working-directory: web/static
      - name: Create TGZ archive
        run: tar -cvzf dist.tgz dist
      - name: Create ZIP Archive
        run: zip -r dist.zip dist
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist.tgz
            dist.zip
