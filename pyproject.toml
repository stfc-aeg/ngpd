[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "scikit_build_core", "cffi>2.1"]
build-backend = "scikit_build_core.build"

[project]
name = "ngpd"
description = "Odin Control Adapter project for the NGPD Multi-channel system"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "odin-control>=2.0",
    "cffi>=2.0"
]
readme = "README.md"

[[project.authors]] 
email = "ashley.neaves@stfc.ac.uk"
name = "Ashley Neaves"

[project.urls]
GitHub = "https://github.com/stfc-aeg/ngpd"

[tool.scikit-build]
sdist.include = ["src/histogrammer/_version.py"]
wheel.exclude = ["ngpd/lib/pyngpd.csrc.c", "ngpd/lib/pyngpd.h"]
wheel.py-api = "cp310.cp315t"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
# Optional settings for setuptools_scm
root = "."
write_to = "src/ngpd/_version.py"
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"